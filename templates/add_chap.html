<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add chapter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
</head>
<body>
 <div>
    <h1>Add chapter in {{subject.name}}</h1>
    <form method="POST" action="{{ url_for('add_chapter',subject_id=subject.id)}}" class="logform">
        <label for="chapter_name" class="form-lebel">Chapter Name</label>
        <input type="text" name="chapter_name" placeholder="chapter name" class="form-control" required>
        <br>
        <label for="chapter_description" class="form-lebel" >Description</label>
        <div>
            <textarea name="chapter_description" placeholder="description"></textarea>
        </div>
        <div style="display: inline-block;">
        <button type="submit" class="btn btn-success">submit</button>
        </div>
        <div style="display: inline-block;">
            <a href="{{ url_for('admin') }}" class="btn btn-danger">Cancel</a>
        </div>
    </form>
   
 </div>
    








    
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
