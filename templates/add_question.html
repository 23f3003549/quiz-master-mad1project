<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
     <title>Question edit </title>
    
</head>
<body>
    {% include 'flashed_message.html' %}
    <div>
        <h1>Add Question to quiz:{{ quiz.id }}</h1>
        <form action="{{ url_for('add_questions', quiz_id= quiz.id) }}" method="post" class="logform">
            <div>
                <label for="question_title" class="form-label">Question Title</label>
                <input type="text" name="question_title" id="question_title" class="form-control" required>
            </div>
            <div>
                <label for="question_text" class="form-label">Question Text</label>
                <textarea name="question_text" class="form-control" required id="question_text" required></textarea>
            </div>
            <br>
            <div>
                <label for="option1" class="form-label">Option1</label>
                <input type="text" name="option1" id="option1" class="form-control" required>
            </div>
            <div>
                <label for="option2" class="form-label">option2</label>
                <input type="text" name="option2" id="option2" class="form-control" required>
            </div>
            <div>
                <label for="option3" class="form-label">option3</label>
                <input type="text" name="option3" id="option3" class="form-control" required>
            </div>
            <div>
                <label for="option4" class="form-label">option4</label>
                <input type="text" name="option4" id="option4" class="form-control" required>
            </div>
            <div>
                <label for="correct_option" class="form-label">Correct Option</label>
                <select name="correct_option" id="correct_option" class="form-control">
                    <option value="" disabled selected >Choose option</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>

                </select>
            </div>
            <br>
            <div  style="display: inline-block;">
                <button type="submit" class="btn btn-success">Save and next</button>
            </div>
            <div  style="display: inline-block;" >
                <a href="/quizz" class="btn btn-danger">Close</a>

            </div>
        </form>
    </div>
    
    
   
    















   <!-- Bootstrap Bundle with Popper -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>  
</body>
</html>
