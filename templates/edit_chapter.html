<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Chapter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
</head>
<body>
    <div class="add-main">
    {% include 'flashed_message.html' %}
    <div class="profile-form">
    <form action="" method="POST" class="logform" id="user-form">
        <div class="add-inner" style="margin-top: 6rem !important;">
        <h2>Edit your chapter</h2>
        <div class="form-group">
        <label for="chapter_name" class="form-label" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; color:black;font-size:larger;text-shadow:none;">Chapter Name</label>
        <input type="text" name="chapter_name" id="chapter_name" class="form-control" value="{{ chapter.name }}" placeholder="new chapter name" required style="border: 1px solid rgb(59, 59, 59);">
        </div>
        <br>
        <div class="mb-3">
            <label for="chapter_description" class="form-label" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; color:black;font-size:larger;text-shadow:none;">Description:</label>
            <textarea name="chapter_description" placeholder="new description" class="form-control" style="border: 1px solid rgb(60, 59, 59);"></textarea>
        </div>
        <div style="display: inline-block;">
        <button type="submit" class="btn btn-success">Update</button>
        </div>
        <div style="display: inline-block;">
            <a href="{{ url_for('admin') }}" class="btn btn-danger">Cancel</a>
        </div>
    </div>
    </form>
</div>
</div>
 
    
      <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
</body>
</html>
