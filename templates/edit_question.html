<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add chapter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <title>Edit Question</title>
</head>
<body>
    <div class="add-main">
    {% include 'flashed_message.html' %}
    
    <div class="logmor" style="position: relative ; width:60%; left:21%;">
        <h2 style="text-align: center; padding-top:0%; font-family:Georgia, 'Times New Roman', Times, serif">Edit your question</h2>
        <div class="q-form">
         <form method="post" class="log-form">
            <div>
                <label for="question_title" class="form-label"  style="color:rgb(0, 0, 0);text-shadow:none;">Question Title</label>
                <input type="text" name="question_title" id="question_title" class="form-control" value="{{ question.question_title }}" required style="border: 1px solid black; color:rgb(0, 0, 0);text-shadow:none;">
            </div>
            <div>
                <label for="question_text" class="form-label"  style="color:rgb(0, 0, 0);text-shadow:none;">Question Text</label>
                <textarea name="question_text" id="question_text" class="form-control" required style="border: 1px solid black; color:rgb(0, 0, 0);text-shadow:none;">{{ question.question_text }}</textarea>
            </div>
            <br>
            <div>
                <label for="option1" class="form-label"  style="color:rgb(0, 0, 0);text-shadow:none;">Option1</label>
                <input type="text" name="option1" id="option1" class="form-control" value="{{ question.option1 }}" style="border: 1px solid black;">
            </div>
            <div>
                <label for="option2" class="form-label"  style="color:rgb(0, 0, 0);text-shadow:none;">Option2</label>
                <input type="text" name="option2" id="option2" class="form-control" value="{{ question.option2 }}" style="border: 1px solid black;" >
            </div>
            <div>
                <label for="option3" class="form-label"  style="color:rgb(0, 0, 0);text-shadow:none;">Option3</label>
                <input type="text" name="option3" id="option3" class="form-control" value="{{ question.option3 }}" style="border: 1px solid black;">
            </div>
            <div>
                <label for="option4" class="form-label" style="color:rgb(0, 0, 0);text-shadow:none;">Option4</label>
                <input type="text" name="option4" id="option4" class="form-control" value="{{ question.option4 }}"style="border: 1px solid black;"  >
            </div>
            <div>
                <label for="correct_option" class="form-label"  style="color:rgb(0, 0, 0);text-shadow:none;">Correct option</label>
                <select name="correct_option" id="correct_option" class="form-control" required style="border: 1px solid black;">
                    <option value="" disabled selected>Choose Option</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
                
                </div>
                <br>
                <div class="edfoo" style="text-align: center;">
                <div style="display: inline-block;">
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
                <div style="display: inline-block;">
                    <a href="{{ url_for('admin') }}" class="btn btn-danger">Cancel</a>
                </div>
                </div>
            </div>


        </form>
    </div>
</div>




   <!-- Bootstrap Bundle with Popper -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
</body>
</html>
