<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <!-- Bootstrap CSS -->
            <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>New Quiz</title>

</head>
<body>
    <div class="add-main">
       {% include 'flashed_message.html' %}
      <div class="profile-form">
        
        <form method="POST" action="{{ url_for('edit_quiz',quiz_id=quiz.id) }}" class="logform" id="user-form">
            <div class="new-quiz">
                <h2>Edit Quiz</h2>
                <label for="exampleFormControlSelect" class="form-label" style="color: black; text-shadow:none;">Chapter Id</label>
                <select name="chapter_id" id="exampleFormControlSelect" class="form-control" style="border-radius: 0%; border:1px solid rgb(127,122,122);">
                    <option value="" disabled selected>Select a chapter</option>
                    {% for chapter in chapters %}
                    <option value="{{ chapter.id }}" >{{ chapter.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <br>
            
            <div class="form-group">
                <label for="date" class="form-label" style="color: black; text-shadow:none;">Date:</label>
                <input type="date" name="date" id="date" class="form-control" required style="border-radius: 0%;border:1px solid rgb(118,115,115)">

            </div>
            <br>
            <div class="form-group">
                <label for="time_duration" class="form-label"style="color: black; text-shadow:none;">Duration(minutes)</label>
                <input type="number" name="time_duration" class="form-control" required style="border-radius: 0%;border:1px solid rgb(118,115,115)">

            </div>
            <br>
            
             <br>
             <div class="form-group" style="display: block; align-items:center" id="quiz-notes">
                <label for="notes" class="form-label" style="color: black; text-shadow:none; position:relative; margin-top:-3rem; height:20%">notes</label>
                <textarea name="notes" id="notes" placeholder="add notes" style="border: 1px solid black; margin-top:3rem" id="place"></textarea>
             </div>
             <br>
             <div class="edq">
             <div style="display:inline-block; margin-top:2 rem">
                <button type="submit" class="btn btn-success">Save</button>
             </div>
             
             <div style="display:inline-block">
                <a href="/quizz" class="btn btn-danger">Cancel</a>
             </div>
            </div>

        </form>
     </div>
    </div>
