<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    {% include 'flashed_message.html' %}
    <div class="container">
        <h2>Edit Subject</h2>
        <br>
        <form method="post">
            <div class="mb-3">
                <label for="subject_name" class="form-lavel">Subject Name:</label>
                <input type="text" class="label-control" id="subject_name" name="subject_name" value="{{ subject.name }}">
            </div>
            <br>
            <div class="mb-3">
                <label for="subject_description" class="form-label">Subject description:</label>
                <textarea name="subject_description" id="subject_description" class="form-control">{{ subject.description }}</textarea>
            </div>
            <button type="submit" class=" btn btn-primary">Update</button>
            <a href="{{ url_for('admin') }}" class=" btn btn-danger">Cancel</a>
        </form>


    </div>




      <!-- Bootstrap Bundle with Popper -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    </body>
</html>
