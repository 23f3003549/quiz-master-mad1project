<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
 

<div class="logbg">
  {% include 'flashed_message.html' %}
    
      <nav class="navbar navbar-expand-lg ">
        <div class="container-fluid" style="padding-left: 2rem; padding-top:0.7rem">
          <a class="navbar-brand" href="/" style="color: rgb(255, 255, 255);" id="navhov">
            <i class=" fa-solid fa-house" style="color: rgb(255, 255, 255); margin-right:4px" ></i>HOME</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav" >
            <ul class="navbar-nav">
                
                <li class="nav-item">
                  <a class=" nav-link hero-text" href="/login" style="color: rgb(255, 255, 255);" id="navhov">LOGIN</a>
                 </li>
                 <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('register') }}" style="color: rgb(255, 255, 255);" id="navhov">REGISTER</a>
                 </li>
               
            </ul>
          </div>
        </div>
      </nav>

      
      <div class="logoglass">
        <div class="logtext">
            <div class="wb hero-text">
                <h3 class="hero-text">Welcome back knowledge enthusiasts</h3>
                <p>To quick start your journey</p>
            </div>
        
       <h2 class="hero-text" style="text-align: center; color:rgb(20, 120, 234); text-shadow:1px 1px 2px rgb(0, 0, 0); font-family:poppins; font-weight:bolder"> LOGIN</h2>
        <div class="login">
         <form action=" " class="logform" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" name="username" required class="form-control">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" required class="form-control">
            </div>
            <br>
            <div style="display: block;">
                <button type="submit" class="btn btn-primary" style="border-radius: 0%; text-shadow:1px 1px 2px black;">Submit</button>
                
            </div>
            <div class="lr" style="color: aliceblue;">
                Are you new here?
                <br>
                <br>
                <a href="{{ url_for('register') }}" class="btn btn-primary" style="border-radius: 0%;" >Register</a>
            </div>

         </form>

       

        </div>

       </div>
    </div>
</div>
<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
