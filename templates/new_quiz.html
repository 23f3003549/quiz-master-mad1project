<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <!-- Bootstrap CSS -->
            <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>New Quiz</title>

</head>
<body>
    {% include 'flashed_message.html' %}
    <div class="quiz-form">
        <h2>New Quiz</h2>
        <form method="POST" action="{{ url_for('new_quiz') }}">
            <div class="form-group">
                <label for="exampleFormControlSelect" class="form-label">Chapter Id</label>
                <select name="chapter_id" id="exampleFormControlSelect" class="form-control">
                    <option value="" disabled selected>Select a chapter</option>
                    {% for chapter in chapters %}
                    <option value="{{ chapter.id }}" >{{ chapter.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <br>
            
            <div class="form-group">
                <label for="date" class="form-label">Date:</label>
                <input type="date" name="date" id="date" class="form-control" required>

            </div>
            <br>
            <div class="form-group">
                <label for="time_duration" class="form-label">Duration(minutes)</label>
                <input type="number" name="time_duration" class="form-control" required>

            </div>
            <br>
            
             <br>
             <div class="form-group">
                <label for="notes" class="form-label">notes</label>
                <textarea name="notes" id="notes" placeholder="add notes"></textarea>
             </div>
             <br>
             <div style="display:inline-block">
                <button type="submit" class="btn btn-success">Save</button>
             </div>
             
             <div style="display:inline-block">
                <a href="{{ url_for('quizz') }}" class="btn btn-danger">Cancel</a>
             </div>

        </form>
    </div>
    
    











  
    
    <!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
</body>
</html>
