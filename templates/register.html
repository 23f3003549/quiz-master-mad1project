{% extends 'layout.html' %}
{% block title %}
register
{% endblock  %}

{% block content %}
<h1 style="text-align: center;"> New User Right?? Welcome To QUIZ MASTER</h1>
    <div>
        <h1 class="display-3">Register</h1>
        <p>Register here to excel your journey</p>
        <form action=" " class="logform" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" name="username" class="form-control">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" required class="form-control">
            </div>
            <div class="form-group">
                <label for="password1" class="form-label">Confirm Password</label>
                <input type="password" name="password1" required class="form-control">
            </div>
            <div class="form-group">
                <label for="fullname" class="form-label">Fullname</label>
                <input type="text" name="fullname" required class="form-control">
            </div>
            <div class="form-group">
                <label for="qualification" class="form-label">Qualification</label>
                <input type="text" name="qualification" class="form-control">
            </div>
            <div class="form-group">
                <label for="dob" class="form-label">Date of birth</label>
                <input type="date" name="dob" class="form-control">
            </div>
            <br>
           <div class="form-group">
            <input type="submit" value="Register" class="btn btn-primary">
           </div>

        </form>

       

    </div>

        
{% endblock %}
