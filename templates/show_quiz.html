<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attemp Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
</head>
<body>
    <div class="question">
    {% include 'flashed_message.html' %}
    <div class="qouter">
    <div style="display: inline-block;">
       <h2>Question no:<span style="border-radius: 50%;">{{ question_num }} /{{ total }}</span></h2>
    </div>
    <div style="display: inline-block;">
        Quiz{{ quiz.id }}
    </div>

    <div class="quiz_box">
        <div class="qst">
            <h3 style="font-family:Verdana, Geneva, Tahoma, sans-serif; font-weight:500; font-size:25px">{{ question.question_text }}</h3>
        </div>
        <br>
    <div class="option">
        <form class="log-form" method="POST" action="">
            <div class="options" id="options">
                <label><input type="radio" name="option" value="1">{{ question.option1 }}</label>
                <br>
                <label><input type="radio" name="option" value="2">{{ question.option2 }}</label>
                <br>
                <label><input type="radio" name="option" value="3">{{ question.option3 }}</label>
                <br>
                <label><input type="radio" name="option" value="4">{{ question.option4 }}</label>
                <br>
                <br>
            </div>
            <div class="btn-container" id="btn-container">
                {% if question_num >= total %}
                <button type="submit" class="btn btn-success" >Submit</button>
                {% else %}
                <button type="submit" class="btn btn-success">Save and Next</button>
                <button type="submit" class="btn btn-success">Submit</button>
                {% endif %}
            </div>
        </form>
    </div>

    </div>
</div>
</div>



 
     <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
