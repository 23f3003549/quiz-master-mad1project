<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style_index.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <title>User Profile</title>
</head>
<body>
<!-- ---------------------------------------------------------------------------navbar------------------------------------------------------------------------------------- -->
<div class="usernav" style="box-shadow: 1px 1px 3px grey;">
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a href="{{ url_for('user_dashboard') }}" class="navbar-brand">HOME</a>
    <button class="navbar-toggler" type="button" data-toggler="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" area-expanded="false" aria-label="Togglr navigation">
        <span class="navbar-toggle-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
                <a href="{{ url_for('user_scores') }}" class="nav-link">Scores</a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('user_summary') }}" class="nav-link">Summary</a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('profile') }}" class="nav-link">Profile</a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('login') }}" class="btn btn-outline-danger">Logout</a>
            </li>
            </ul>
            <form method="GET" action="/user_dashboard"  class="form-inline my-2 my-lg-0" style="display: flex; margin-left:40%">
                <select class="form-control mr-sm-2" type="search" style="margin-left: 0rem;" name="search_type">
                  <option value="" disable selected>select</option>
                  <option value="subject" {% if search_type == 'subject' %} selected {% endif %}>Subject</option>
                  <option value="chapter" {% if search_type == 'chapter' %} selected {% endif %}>Chapter</option>
                  <option value="date" {% if search_type == 'date' %} selected {% endif %}>Date</option>
                </select>
                <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search" name="query" value="{{ query or '' }}">
                <button class="btn btn-outline-success my-2 my-sm-0" type="submit" style="margin-left: 0.5rem; margin-right:1rem;">Search</button>
              </form>
              <div>
                <h3 class="wel"id="wel">Welcome user</h3>
              </div>
              
        
    </div>

</nav>
</div>
<div>
{% include 'flashed_message.html' %}
  <div style="text-align:center; font-family:cursive; font-weight:lighter; font-size:40px" >
    Hello {{ user.fullName }}
</div >
<div class="profile-form">
    <div class="profile-pic" id="profile-pic">
        <img src="https://api.dicebear.com/6.x/lorelei/svg?seed={{ user.fullName }}" width="100" alt="profile-pic" id="user-pic" style="border-radius: 50%; backface-visibility:hidden;">
    </div>
    

    <!-- form to change the password and username -->
     <form action="/profile" method="post" class="form" id="user-form">
    <div class="uf">
        <div class="form_group">
            <label for="username" class="form-label" >Username</label>
            <input type="text" name="username" id="username" class="form-control" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label for="cpassword" class="form-label">current password</label>
            <input type="password" name="cpassword" id="cpassword" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">New password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="fullname" class="form-label">New name</label>
            <input type="text" name="fullname" id="fullname" value="{{ user.fullName }}" class="form-control">
        </div>
        <br>
        <div class="form-group">
            <input type="submit" value="Update" class="btn btn-outline-primary">
            <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Logout</a>
        </div>
    </div>

     </form>

</div>  
<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
