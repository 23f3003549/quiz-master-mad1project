<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <title>Scores</title>
</head>
<body>
       <!-- ---------------------------------------------------------------------navbar-------------------------------------------------------------------------------------- -->
       <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/user_dashboard">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item">
              
              <a class="nav-link" href="{{ url_for('user_scores') }}">Scores</a>
              
            </li>
            <li class="nav-item">
              <a class="nav-link " href="{{ url_for('user_summary') }}">Summary</a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('profile') }}" class="nav-link">profile</a>
            </li>
            <li class="nav-item">
                <a href="/login" class="btn btn-danger">logout</a>
            </li>
          </ul>
          <form class="form-inline my-2 my-lg-0" style="display: flex; margin-left:50%">
            <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit" style="margin-left: 1rem;">Search</button>
          </form>
          <div>
            <h3 style="text-align: center;">Welcome User</h3>
          </div>
        </div>
      </nav>

      <!-- -------------------------------------------------------------------------------bar graph for no of quizes per subject------------------------------------------------------ -->
      <h1 style="text-align: center;">SUMMARY</h1>
      <div style="position: relative; display:inline-block; margin-left:10%">
        <canvas id="myChartBar"></canvas>
      </div>

      <div style="position: relative; display:inline-block; margin-left:20%">
        <canvas id="myChartPie"></canvas>
      </div>
      
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      
      <script>
        const barctx = document.getElementById('myChartBar');
      
        new Chart(barctx, {
          type: 'bar',
          data: {
            labels: {{ sub_names|safe }},
            datasets: [{
              label: '#no of quizzes',
              data: {{ quiz_counts|safe }},
              borderWidth: 1
            }]
          },
          options: {
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });


        const piectx = document.getElementById('myChartPie');
        new Chart(piectx, {
            type: 'pie',
            data: {
              labels: {{ months|safe }},
              datasets: [{
                label: '#no of quiz attempted',
                data: {{ quizzes|safe }},
                borderWidth: 1
              }]
            },
            options: {
              scales: {
                y: {
                  beginAtZero: true
                }
              }
            }
          });
      </script>






      <!-- Bootstrap Bundle with Popper -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    </body>
</html>
